name: Token Conservation
description: |
  Verify that token conservation holds throughout the simulation.
  Accounted supply across members, staking, delegation, treasuries, locked
  balances, and liquidity pools must equal initial + minted - burned supply.
baseConfig:
  template: compound
  overrides:
    voting_activity: 0.3
    proposal_creation_probability: 0.005
    validateEconomicInvariants: true
  population:
    totalMembers: 100
    distribution:
      - archetype: passive_holder
        percentage: 40
      - archetype: active_voter
        percentage: 40
      - archetype: delegate
        percentage: 20
sweep:
  parameter: seed
  values:
    - 42
    - 123
    - 456
execution:
  runsPerConfig: 5
  stepsPerRun: 300
  seedStrategy: sequential
  baseSeed: 42
metrics:
  - name: Proposal Pass Rate
    type: builtin
    builtin: proposal_pass_rate
  - name: Total Proposals
    type: builtin
    builtin: total_proposals
  - name: Final Treasury
    type: builtin
    builtin: final_treasury
  - name: Final Token Price
    type: builtin
    builtin: final_token_price
  - name: Token Conservation Error
    type: builtin
    builtin: token_conservation_error
output:
  directory: results/validation/conservation
  formats:
    - json
