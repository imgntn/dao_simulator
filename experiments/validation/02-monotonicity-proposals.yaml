name: Proposal Creator Monotonicity
description: |
  Verify that proposal_creation_probability controls proposal count in
  expectation under matched replicate seeds and a fixed population.
baseConfig:
  template: compound
  overrides:
    voting_activity: 0.3
    proposal_creation_probability: 0.005
  population:
    distribution:
      - archetype: passive_holder
        percentage: 40
      - archetype: active_voter
        percentage: 40
      - archetype: delegate
        percentage: 20
sweep:
  parameter: proposal_creation_probability
  values:
    - 0
    - 0.0025
    - 0.005
    - 0.01
    - 0.02
execution:
  runsPerConfig: 10
  stepsPerRun: 150
  seedStrategy: sequential
  baseSeed: 42
metrics:
  - name: Proposal Pass Rate
    type: builtin
    builtin: proposal_pass_rate
  - name: Average Turnout
    type: builtin
    builtin: average_turnout
  - name: Total Proposals
    type: builtin
    builtin: total_proposals
output:
  directory: results/validation/monotonicity-proposals
  formats:
    - json
    - csv
