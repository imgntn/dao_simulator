id: robustness-delegation-depth-final
name: Delegation-Depth Sensitivity - Paired Publication Study
description: Stress-tests shallow, bounded, and unlimited delegation resolution in a delegation-specialist population.
version: 1.0.0
author: DAO Simulator Research Framework
tags:
  - publication
  - robustness
  - paired-final
research:
  classification: exploratory
  publicationRole: supporting-exploratory
  researchQuestionIds:
    - ROBUSTNESS-DELEGATION
  hypothesis: Delegation resolution depth changes whale vote-weight influence more than it changes proposal completion.
  primaryOutcome: whale_influence
  secondaryOutcomes:
    - delegate_concentration
    - voter_concentration_gini
    - proposal_completion_rate
    - voter_participation_rate
  analysisModel: paired_contrast
  comparisonCorrection: holm
  smallestEffectOfInterest:
    value: 0.05
    unit: absolute vote-weight share
    rationale: A change of this magnitude would alter interpretation of the core findings.
  analysisFamily: publication-robustness
  experimentalUnit: One seeded DAO simulation replicate under one robustness condition.
  estimatedRuntimeMinutes: 240
