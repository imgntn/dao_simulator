id: supporting-learning-activation
name: Learning Activation Analysis
description: >
  Measures the impact of reinforcement learning on agent behavior. Compares
  fixed heuristics with within-replicate tabular Q-learning, replay, and
  same-type shared experience. Replicate state is never carried between runs.
version: 1.0.0
author: DAO Simulator Research Framework
tags:
  - paper
  - reinforcement-learning
  - q-learning
  - dqn
  - agent-adaptation
  - convergence
research:
  classification: exploratory
  publicationRole: supporting-exploratory
  researchQuestionIds: [RQ-LEARNING-SUPPORT]
  hypothesis: Within-replicate tabular learning changes governance activity relative to fixed heuristics, and replay or same-type sharing further changes the learned policy.
  primaryOutcome: governance_activity_index
  secondaryOutcomes:
    - proposal_completion_rate
    - voter_participation_rate
    - voter_concentration_gini
  analysisModel: paired_contrast
  comparisonCorrection: holm
  smallestEffectOfInterest:
    value: 0.05
    unit: governance activity index
    rationale: Smaller shifts would not change the substantive interpretation of the primary governance experiments.
  analysisFamily: supporting-learning-activation
  experimentalUnit: One independent seeded DAO simulation replicate under one learning condition.
  estimatedRuntimeMinutes: 180

baseConfig:
  template: compound
  overrides:
    forum_enabled: true
    oracle_type: calibrated_gbm
    calibration_dao_id: compound
    learning_persist_q_tables: false

sweep:
  type: zip
  grid:
    # RL mode labels (matched by index)
    - parameter: learning_enabled
      values: [false, true, true, true]
    - parameter: learning_experience_replay
      values: [false, false, true, true]
    - parameter: learning_shared_experience
      values: [false, false, false, true]

execution:
  runsPerConfig: 30
  stepsPerRun: 1440
  seedStrategy: sequential
  baseSeed: 1600
  workers: 4
  runTimeoutMs: 600000
  learningEpisodesPerRun: 4

metrics:
  - name: Proposal Pass Rate
    type: builtin
    builtin: proposal_pass_rate
    description: "% of resolved proposals that passed"
  - name: Proposal Completion Rate
    type: builtin
    builtin: proposal_completion_rate
    description: Fraction of proposals reaching a terminal governance decision
  - name: Average Turnout
    type: builtin
    builtin: average_turnout
    description: Token-weighted voter participation
  - name: Final Treasury
    type: builtin
    builtin: final_treasury
    description: Treasury balance at simulation end
  - name: Final Token Price
    type: builtin
    builtin: final_token_price
    description: Token price at simulation end
  - name: Voter Participation Rate
    type: builtin
    builtin: voter_participation_rate
    description: "% of members who ever voted"
  - name: Governance Capture Risk
    type: builtin
    builtin: governance_capture_risk
    description: Concentration of proposal creation
  - name: Whale Influence
    type: builtin
    builtin: whale_influence
    description: "% of votes from top 10% holders"
  - name: Voter Concentration Gini
    type: builtin
    builtin: voter_concentration_gini
    description: Inequality of voting activity
  - name: Final Gini
    type: builtin
    builtin: final_gini
    description: Token distribution Gini coefficient
  - name: Quorum Reach Rate
    type: builtin
    builtin: quorum_reach_rate
    description: "% of proposals meeting quorum"
  - name: Treasury Volatility
    type: builtin
    builtin: treasury_volatility
    description: Coefficient of variation of treasury
  - name: Governance Activity Index
    type: builtin
    builtin: governance_activity_index
    description: Composite governance activity outcome used for the preregistered RL contrast
  - name: Learning Agent Count
    type: builtin
    builtin: learning_agent_count
    description: Number of agents exposing complete learning diagnostics
  - name: Mean Learning Q-Table Size
    type: builtin
    builtin: learning_q_table_size_mean
    description: Mean learned state-action entry count per learning agent
  - name: Mean Learning State Count
    type: builtin
    builtin: learning_state_count_mean
    description: Mean learned state count per learning agent
  - name: Mean Learning Episode Count
    type: builtin
    builtin: learning_episode_count_mean
    description: Mean completed episode count per learning agent
  - name: Mean Learning Exploration Rate
    type: builtin
    builtin: learning_exploration_rate_mean
    description: Mean final epsilon-greedy exploration rate
  - name: Mean Learning Total Reward
    type: builtin
    builtin: learning_total_reward_mean
    description: Mean cumulative reward per learning agent

output:
  directory: results/paper/16-rl-activation
  formats:
    - json
    - csv
  includeRawRuns: true
  includeManifest: true
  includeTimeline: true
  timelineStride: 24
