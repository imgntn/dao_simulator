# Generated from experiments/paper/04-governance-capture-mitigations.yaml; regenerate with npm run catalog:pilots.
id: rq2-capture-mitigation-factorial-pilot
name: Governance Capture Mitigations — Paired Pilot
description: Sweep vote power mitigations to quantify capture resistance vs throughput. Eight-replicate paired-seed pilot for variance, diagnostics, and final power planning.
version: 1.0.0
author: DAO Simulator Research Framework
tags:
  - paper
  - governance
  - capture
  - mitigations
  - pilot
research:
  classification: exploratory
  publicationRole: pilot-development
  researchQuestionIds:
    - RQ2
  hypothesis: Vote-power caps and quadratic attenuation reduce the share of proposal-time vote weight controlled by the top token-holding decile while preserving decision throughput. This pilot estimates paired variance and checks outcome support before the confirmatory freeze.
  primaryOutcome: whale_influence
  secondaryOutcomes:
    - proposal_completion_rate
    - governance_capture_risk
    - voting_power_utilization
    - voter_concentration_gini
  analysisModel: factorial_ols
  comparisonCorrection: holm
  smallestEffectOfInterest:
    value: 0.05
    unit: absolute vote-weight share
    rationale: A five-percentage-point change in the top token-holding decile's share of cast vote weight is the smallest practically important capture-mitigation effect.
  analysisFamily: rq2-capture-factorial
  experimentalUnit: One seeded DAO simulation replicate under one factorial policy condition.
  estimatedRuntimeMinutes: 58
baseConfig:
  template: compound
  population:
    totalMembers: 200
    distribution:
      - archetype: passive_holder
        percentage: 50
      - archetype: delegate
        percentage: 20
      - archetype: governance_expert
        percentage: 10
      - archetype: developer
        percentage: 10
      - archetype: investor
        percentage: 10
  overrides:
    governance_rule: majority
    governance_config:
      quorumPercentage: 0.05
    voting_activity: 0.25
    proposal_creation_probability: 0.004
    proposal_duration_min_steps: 24
    proposal_duration_max_steps: 96
    treasury_stabilization_enabled: true
    treasury_target_reserve: 10000
    treasury_target_reserve_fraction: 0.6
    treasury_buffer_fraction: 0.2
    treasury_buffer_fill_rate: 0.5
    treasury_emergency_topup_rate: 0.25
    treasury_max_spend_fraction: 0.15
    participation_target_rate: 0.2
    participation_boost_strength: 0.6
    participation_boost_decay: 0.1
    participation_boost_max: 0.25
    participation_inactivity_boost: 0.15
    proposal_bond_fraction: 0.01
    proposal_bond_min: 10
    proposal_bond_max: 1000
    proposal_inactivity_steps: 72
    proposal_temp_check_fraction: 0.25
    proposal_fast_track_min_steps: 6
    proposal_fast_track_approval: 0.6
    proposal_fast_track_quorum: 0.2
sweep:
  grid:
    - parameter: vote_power_cap_fraction
      values:
        - 0
        - 0.1
        - 0.2
    - parameter: vote_power_quadratic_threshold
      values:
        - 0
        - 250
        - 500
    - parameter: vote_power_velocity_penalty
      values:
        - 0
        - 0.3
        - 0.6
execution:
  runsPerConfig: 8
  stepsPerRun: 2000
  seedStrategy: fixed
  workers: 4
  fixedSeeds:
    - 910001
    - 910019
    - 910031
    - 910043
    - 910057
    - 910069
    - 910081
    - 910097
metrics:
  - name: Proposal Completion Rate
    type: builtin
    builtin: proposal_completion_rate
    description: Fraction of proposals reaching a valid terminal governance decision
  - name: Whale Influence
    type: builtin
    builtin: whale_influence
    description: "% of votes from top 10% token holders"
  - name: Whale Proposal Rate
    type: builtin
    builtin: whale_proposal_rate
    description: "% of proposals created by whales"
  - name: Governance Capture Risk
    type: builtin
    builtin: governance_capture_risk
    description: Concentration of proposal creation
  - name: Single Entity Control
    type: builtin
    builtin: single_entity_control
    description: Max % any one member could control
  - name: Collusion Threshold
    type: builtin
    builtin: collusion_threshold
    description: Min % of members for majority control
  - name: Voter Concentration Gini
    type: builtin
    builtin: voter_concentration_gini
    description: Inequality of voting activity
  - name: Voting Power Utilization
    type: builtin
    builtin: voting_power_utilization
    description: "% of available voting power actually used"
  - name: Proposal Pass Rate
    type: builtin
    builtin: proposal_pass_rate
    description: "% of resolved proposals that passed"
  - name: Quorum Reach Rate
    type: builtin
    builtin: quorum_reach_rate
    description: "% of proposals meeting quorum"
  - name: Avg Time to Decision
    type: builtin
    builtin: avg_time_to_decision
    description: Average steps from proposal to resolution
output:
  directory: results/pilot/04-governance-capture-mitigations
  formats:
    - json
    - csv
  includeRawRuns: true
  includeManifest: true
  includeTimeline: true
  timelineStride: 24
